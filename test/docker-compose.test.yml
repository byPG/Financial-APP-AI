# E2E test infrastructure: the app container + a Playwright container.
# Kept separate from the production docker-compose.yml so browser test
# dependencies never end up in the production image.
# See planning/PLAN.md Section 12 (Testing Strategy — E2E).
#
# This is scaffolding only: there are no Playwright spec files yet (a later
# phase adds them under test/specs/ or similar). This file just establishes
# the correct shape -- app service + test-runner service, health-gated.
#
# Usage (once specs exist):
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finance-app:test
    container_name: finance-app-test
    ports:
      - "8000:8000"
    environment:
      # E2E tests run against deterministic mock LLM responses, no API key
      # or network calls required. See planning/PLAN.md Section 5 / 12.
      LLM_MOCK: "true"
      OPENROUTER_API_KEY: "unused-in-mock-mode"
    volumes:
      # Ephemeral, isolated test data -- not the developer's real ./db.
      - test-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    container_name: finance-app-playwright
    working_dir: /work
    volumes:
      # Mount the test/ directory so specs (once written) are available
      # inside the container without baking them into an image.
      - ./:/work
    environment:
      BASE_URL: "http://app:8000"
    depends_on:
      app:
        condition: service_healthy
    # Placeholder command: no specs exist yet. Once test/specs/ (or similar)
    # is populated with a package.json + Playwright config, replace this
    # with e.g. `npm ci && npx playwright test`.
    command: ["true"]

volumes:
  test-db:
