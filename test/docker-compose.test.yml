# E2E test infrastructure: the app container + a Playwright container.
# Kept separate from the production docker-compose.yml so browser test
# dependencies never end up in the production image.
# See planning/PLAN.md Section 12 (Testing Strategy — E2E).
#
# Usage:
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finance-app:test
    container_name: finance-app-test
    ports:
      - "8000:8000"
    networks:
      default:
        # A bare single-label Compose service name (no dot) makes Chromium's
        # HTTPS-Upgrades heuristic silently try to upgrade the Playwright
        # container's http:// navigation to https:// first, which then
        # fails with net::ERR_SSL_PROTOCOL_ERROR against this plain-HTTP
        # server -- IPs and dotted hostnames are exempt, bare ones aren't.
        # A dotted alias sidesteps that without touching browser flags.
        aliases:
          - app.local
    environment:
      # E2E tests run against deterministic mock LLM responses, no API key
      # or network calls required. See planning/PLAN.md Section 5 / 12.
      LLM_MOCK: "true"
      OPENROUTER_API_KEY: "unused-in-mock-mode"
    # No volume: /app/db lives in the container's own writable layer, so
    # every `up --build` starts from a genuinely empty, freshly-seeded
    # database (01-fresh-start.spec.ts depends on this) with no manual
    # cleanup between runs.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  playwright:
    # Must match the @playwright/test version pinned in test/package.json --
    # this image's pre-baked browsers have to match exactly, or
    # browserType.launch() fails looking for a browser build that isn't
    # there (npm ci resolves whatever that pin says, independent of what
    # version this image tag implies).
    image: mcr.microsoft.com/playwright:v1.62.1-jammy
    container_name: finance-app-playwright
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      BASE_URL: "http://app.local:8000"
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "npm ci && npx playwright test"]
