[project]
name = "finance-app-backend"
version = "0.1.0"
description = "FastAPI backend for Finance App — AI Trading Workstation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sse-starlette>=2.1.0",
    "litellm>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "respx>=0.21.1",
]

[tool.uv]
package = false

[tool.ruff.lint]
# B008 flags `Depends(...)` used as a function-argument default as a "call
# in a default argument" — but that's the standard, FastAPI-documented way
# to do dependency injection, not a bug, and every route in app/ uses it.
ignore = ["B008"]
